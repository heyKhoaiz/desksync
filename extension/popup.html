<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DeskSync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Icon sprite. Used from here and from icon() in popup.js. -->
  <!-- Icon sprite. Used from here and from icon() in popup.js. -->

    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></symbol>

    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1"/><path d="M12 2.4h0a1.9 1.9 0 0 1 1.9 1.9v.3a1.6 1.6 0 0 0 .9 1.4 1.6 1.6 0 0 0 1.8-.3l.2-.2a1.9 1.9 0 1 1 2.7 2.7l-.2.2a1.6 1.6 0 0 0-.3 1.8 1.6 1.6 0 0 0 1.4.9h.3a1.9 1.9 0 1 1 0 3.8h-.3a1.6 1.6 0 0 0-1.4.9 1.6 1.6 0 0 0 .3 1.8l.2.2a1.9 1.9 0 1 1-2.7 2.7l-.2-.2a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-.9 1.4v.3a1.9 1.9 0 1 1-3.8 0v-.3a1.6 1.6 0 0 0-1-1.4 1.6 1.6 0 0 0-1.7.3l-.2.2a1.9 1.9 0 1 1-2.7-2.7l.2-.2a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.4-.9h-.3a1.9 1.9 0 1 1 0-3.8h.3a1.6 1.6 0 0 0 1.4-1 1.6 1.6 0 0 0-.3-1.7l-.2-.2a1.9 1.9 0 1 1 2.7-2.7l.2.2a1.6 1.6 0 0 0 1.7.3h.1a1.6 1.6 0 0 0 1-1.4v-.3A1.9 1.9 0 0 1 12 2.4z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.6v2.1M12 19.3v2.1M2.6 12h2.1M19.3 12h2.1M5.4 5.4l1.5 1.5M17.1 17.1l1.5 1.5M18.6 5.4l-1.5 1.5M6.9 17.1l-1.5 1.5"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.8A8.6 8.6 0 0 1 9.2 3.5a8.6 8.6 0 1 0 11.3 11.3z"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></symbol>

    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.500 3 8 7 10 4-2 7-5.500 7-10V6z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 4H7l3-4zM12 14v7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8 5 4 9l4 4M4 9h10a5 5 0 0 1 0 10H9"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4V4h11v1"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 20 1-4L16 5l3 3L8 19zM14 7l3 3"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></symbol>
    <symbol id="i-fill" viewBox="0 0 24 24"><path d="M12 3v9M8.5 8.5 12 12l3.5-3.5M5 16v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 8-8M16 7l3 3"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h.01M15 15h.01M15 9h.01M9 15h.01"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 21h6M12 16v5"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
    <symbol id="i-exit" viewBox="0 0 24 24"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/></symbol>
    <symbol id="i-sync" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5l2 2M20 4v5h-5M20 12a8 8 0 0 1-14 5l-2-2M4 20v-5h5"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"/></symbol>
    <!-- "Everything" must not look like "Notes": both were three horizontal lines. -->
    <symbol id="i-all" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.8"/><rect x="13" y="4" width="7" height="7" rx="1.8"/><rect x="4" y="13" width="7" height="7" rx="1.8"/><rect x="13" y="13" width="7" height="7" rx="1.8"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M18 13.5V19H5V6h5.5"/></symbol>
  </svg>

  <!-- ---------- Auth ---------- -->

  <!-- ---------- Auth ---------- -->
  <section id="auth" class="hidden">
    <div class="box">
      <div class="mark" aria-hidden="true">D</div>
      <h1>DeskSync</h1>
      <p>One account for every Chrome profile and your phone.</p>
      <form id="auth-form">
        <input id="auth-email" type="email" placeholder="Email" required autocomplete="username">
        <input id="auth-pass" type="password" placeholder="Password (min 8)" minlength="8" required autocomplete="current-password">
        <div class="row">
          <button type="submit" data-mode="signin" class="primary">Sign in</button>
          <button type="submit" data-mode="signup" class="ghost">Create account</button>
        </div>
        <p id="auth-msg" class="msg" role="alert"></p>
      </form>
    </div>
  </section>

  <!-- ---------- App ---------- -->
  <section id="app" class="hidden">
    <!-- The four types, then trash and settings. The types are the app's;
         the tags under the search field are the user's own. -->
    <nav class="rail" aria-label="Type">
      <button class="mark" id="home" title="Everything">D</button>
      <button data-f="all"    aria-pressed="true"  title="Everything"><svg class="i"><use href="#i-all"/></svg></button>
      <button data-f="note"   aria-pressed="false" title="Notes"><svg class="i"><use href="#i-note"/></svg></button>
      <button data-f="link"   aria-pressed="false" title="Read later"><svg class="i"><use href="#i-bookmark"/></svg></button>
      <button data-f="clip"   aria-pressed="false" title="Clipboard"><svg class="i"><use href="#i-clip"/></svg></button>
      <button data-f="vault"  aria-pressed="false" title="Vault"><svg class="i"><use href="#i-shield"/></svg></button>
      <div class="spacer"></div>
      <button id="theme" title="Theme"><svg class="i"><use href="#i-monitor"/></svg></button>
      <button data-screen="trash"    aria-pressed="false" title="Trash"><svg class="i"><use href="#i-trash"/></svg></button>
      <button data-screen="settings" aria-pressed="false" title="Settings"><svg class="i"><use href="#i-gear"/></svg></button>
    </nav>

    <div class="mid" id="mid">
      <div class="search">
        <svg class="i"><use href="#i-search"/></svg>
        <!-- Focus lives here the whole time. The highlighted row is tracked with
             aria-activedescendant so typing keeps working while you arrow. -->
        <input id="q" type="text" placeholder="Search everything" autocomplete="off"
               role="combobox" aria-expanded="true" aria-controls="list" aria-autocomplete="list"
               aria-label="Search notes, read later, clipboard and vault">
        <kbd>esc</kbd>
      </div>
      <div id="offline-bar" class="offline-bar hidden" role="status"></div>
      <div class="tagbar" id="tagbar" role="group" aria-label="Filter by tag"></div>
      <div class="listcard">
        <div class="listhead" id="listhead"></div>
        <ul class="list" id="list" role="listbox" aria-label="Results"></ul>
        <div class="count">
          <button id="to-settings">Settings</button>
          <span>&#8593;&#8595; move &#183; &#9166; open</span>
        </div>
      </div>
    </div>

    <section class="detail" id="detail" aria-live="polite" aria-label="Selected item"></section>
    <section class="screen" id="screen" hidden tabindex="-1"></section>

    <div id="toast" class="toast hidden" role="status"></div>
  </section>

  <script src="lib/supabase.js"></script>
  <script src="config.js"></script>
  <script src="lib/client.js"></script>
  <script src="lib/crypto.js"></script>
  <script src="lib/markdown.js"></script>
  <script src="popup.js"></script>
</body>
</html>
