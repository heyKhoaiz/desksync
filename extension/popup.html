  <!-- ---------- App ---------- -->

      <!-- Shown on the Free plan only; opens Settings, where the plan is. -->
      <button class="plan-tag hidden" id="plan-tag" title="You are on Free. See what Pro adds in Settings">Free</button>
      <button data-f="all"    aria-pressed="true"  title="Everything (Ctrl+1)"><svg class="i"><use href="#i-all"/></svg><span class="lbl">All</span></button>
      <button data-f="note"   aria-pressed="false" title="Notes (Ctrl+2)"><svg class="i"><use href="#i-note"/></svg><span class="lbl">Notes</span></button>
      <button data-f="link"   aria-pressed="false" title="Read later (Ctrl+3)"><svg class="i"><use href="#i-bookmark"/></svg><span class="lbl">Later</span></button>
      <button data-f="clip"   aria-pressed="false" title="Clipboard (Ctrl+4)"><svg class="i"><use href="#i-clip"/></svg><span class="lbl">Clips</span></button>
      <button data-f="vault"  aria-pressed="false" title="Vault (Ctrl+5)"><svg class="i"><use href="#i-shield"/></svg><span class="lbl">Vault</span></button>
      <div class="spacer"></div>
      <button id="to-panel" class="sm" title="Keep DeskSync open in the side panel" aria-label="Open in the side panel"><svg class="i"><use href="#i-panel"/></svg></button>
      <button id="theme" class="sm" title="Theme"><svg class="i"><use href="#i-sun"/></svg></button>
      <button data-screen="trash"    class="sm" aria-pressed="false" title="Trash"><svg class="i"><use href="#i-trash"/></svg></button>
      <button data-screen="settings" class="sm" aria-pressed="false" title="Settings"><svg class="i"><use href="#i-gear"/></svg></button>
    </nav>

    <div class="mid" id="mid">
      <div class="search">
        <svg class="i"><use href="#i-search"/></svg>
        <!-- Focus lives here the whole time. The highlighted row is tracked with
             aria-activedescendant so typing keeps working while you arrow. -->
        <input id="q" type="text" placeholder="Search everything" autocomplete="off"
               role="combobox" aria-expanded="true" aria-controls="list" aria-autocomplete="list"
               aria-label="Search notes, read later, clipboard and vault">
        <kbd>esc</kbd>
      </div>
      <div id="offline-bar" class="offline-bar hidden" role="status"></div>
      <div id="review-ask" class="review-ask hidden" role="status"></div>
      <div class="tagbar" id="tagbar" role="group" aria-label="Filter by tag"></div>
      <div class="listcard">
        <!-- Quick capture. Clicking here, or typing the first letter, opens a new
             note with the whole popup to write in. -->
        <div class="compose hidden" id="compose">
          <svg class="i"><use href="#i-edit"/></svg>
          <input id="compose-in" type="text" placeholder="Take a note&#8230;" autocomplete="off"
                 aria-label="Take a note" maxlength="2000">
        </div>
        <div class="listhead" id="listhead"></div>
        <ul class="list" id="list" role="listbox" aria-label="Results"></ul>
        <div class="count">
          <span id="keyhint">&#8593;&#8595; move &#183; &#9166; open</span>
        </div>
      </div>
    </div>

    <!-- No aria-live here: the editor lives in this pane, and a live region
         re-announced the note on every keystroke. The save status carries it. -->
    <section class="detail" id="detail" aria-label="Selected item"></section>
    <section class="screen" id="screen" hidden tabindex="-1"></section>

    <div id="toast" class="toast hidden" role="status"></div>
  </section>

  <script src="lib/supabase.js"></script>
  <script src="config.js"></script>
  <script src="lib/store.js"></script>
  <script src="lib/client.js"></script>
  <script src="lib/crypto.js"></script>
  <script src="lib/plaintext.js"></script>
  <script src="lib/detect.js"></script>
  <script src="lib/tags.js"></script>
  <script src="lib/codes.js"></script>
  <script src="lib/sites.js"></script>
  <script src="lib/fill.js"></script>
  <script src="lib/tasks.js"></script>
  <script src="lib/format.js"></script>
  <script src="lib/editor.js"></script>
  <script src="popup.js"></script>
</body>
</html>
