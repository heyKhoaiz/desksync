# desksync.org on WordPress, locally. The theme folder is mounted live: edit and refresh.
#
#   make wp-up        http://localhost:8120   (first run: make wp-install)
#   make wp-down      stop, keep the data
#   make wp-reset     stop and wipe the local database
name: desksync-wp

services:
  wordpress:
    image: wordpress:7.0-php8.4-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8120:80'
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: '1'
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - wp-core:/var/www/html
      - ./theme/desksync:/var/www/html/wp-content/themes/desksync
      - ./bin:/var/www/html/wp-content/desksync-bin:ro

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20

  # WP-CLI on demand: docker compose run --rm cli wp <command>
  cli:
    image: wordpress:cli-php8.4
    profiles: ['cli']
    user: '33:33'
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp-core:/var/www/html
      - ./theme/desksync:/var/www/html/wp-content/themes/desksync
      - ./bin:/var/www/html/wp-content/desksync-bin:ro

volumes:
  wp-core:
  db-data:
